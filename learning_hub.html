<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Học Tập & Hiệu Chỉnh Phân Loại AI | ytuong.fedu.vn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
<script>
    async function loadLearningPatterns() {
        try {
            const res = await fetch('LEARNED_PATTERNS.json');
            const data = await res.json();
            
            if(data.learning_stats) {
                const scoreVal = document.getElementById('score_val');
                if(scoreVal) scoreVal.innerText = data.learning_stats.current_alignment_score;
                
                const targetScore = document.getElementById('target_score');
                if(targetScore) targetScore.innerText = data.learning_stats.target_alignment_score;
                
                const scoreBar = document.getElementById('score_bar');
                if(scoreBar) scoreBar.style.width = data.learning_stats.current_alignment_score + '%';
                
                const totalCorrections = document.getElementById('total_corrections');
                if(totalCorrections) totalCorrections.innerText = data.learning_stats.total_corrections || 0;
            }
            if(data.distilled_rules) {
                const distilledRules = document.getElementById('distilled_rules');
                if(distilledRules) distilledRules.innerText = data.distilled_rules.length;
            }
            
            if(data.recent_corrections && Array.isArray(data.recent_corrections)) {
                const tbody = document.getElementById('diff_log_body');
                if(tbody) {
                    tbody.innerHTML = ''; // clear mock
                    
                    // reverse to show newest first, take top 10
                    const recent = [...data.recent_corrections].reverse().slice(0, 10);
                    
                    recent.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-800/30 transition';
                        
                        // Extract handle
                        let titleHtml = c.video_title || 'Unknown Video';
                        let handle = 'Creator';
                        const match = titleHtml.match(/@([a-zA-Z0-9_.-]+)/);
                        if(match) {
                            handle = '@' + match[1];
                        }

                        // format arrays
                        const aiInd = (c.ai_predicted?.industries || []).join(', ');
                        const aiStyle = c.ai_predicted?.shooting_style || '';
                        const aiText = [aiInd, aiStyle].filter(Boolean).join(' &bull; ');
                        
                        const mInd = (c.mentor_corrected?.industries || []).join(', ');
                        const mStyle = c.mentor_corrected?.shooting_style || '';
                        const mText = [mInd, mStyle].filter(Boolean).join(' &bull; ');

                        tr.innerHTML = `
                            <td class="p-3 font-semibold text-white">
                                <div>${handle}</div>
                                <div class="text-[11px] text-slate-500 font-normal line-clamp-1" title="${titleHtml}">${titleHtml}</div>
                            </td>
                            <td class="p-3 text-rose-400">
                                ${aiText || 'Chưa phân loại'}
                            </td>
                            <td class="p-3 text-emerald-400 font-semibold">
                                ${mText || 'Chưa phân loại'}
                            </td>
                            <td class="p-3 text-slate-300 max-w-[200px]">
                                ${c.reason_distilled || 'Hiệu chỉnh trực tiếp'}
                            </td>
                            <td class="p-3 font-mono text-sky-400">
                                ${c.applied_rule || 'MANUAL'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }
        } catch(e) {
            console.error('Error loading LEARNED_PATTERNS.json', e);
        }
    }
    document.addEventListener('DOMContentLoaded', loadLearningPatterns);
</script>
</body>
</html>
