<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm Cảnh Trám (B-Roll) Tham Chiếu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                        dark: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.25s ease; }
        .glass-card:hover { border-color: #8b5cf6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .badge { padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="mb-8">
            <h1 class="text-3xl font-bold mb-2">Kho Tham Chiếu Cảnh Trám</h1>
            <p class="text-slate-400 text-sm">Truy xuất nhanh dữ liệu từ B-Roll Bank Master</p>
        </header>

        <!-- Search and Filter -->
        <div class="glass-card p-4 rounded-xl space-y-4">
            <input type="text" id="searchInput" placeholder="Tìm kiếm cảnh trám, câu thoại, mô tả..." 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-500">
            
            <div class="flex items-center gap-3 text-sm">
                <select id="categoryFilter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                    <option value="all">Tất cả danh mục</option>
                    <option value="cutaway">Cutaway</option>
                    <option value="sequence">Sequence</option>
                    <option value="pov">POV</option>
                    <option value="in_situ">In Situ (Vừa làm vừa nói)</option>
                    <option value="intercut">Intercut</option>
                    <option value="metaphor">Metaphor</option>
                    <option value="negative_space">Negative Space</option>
                    <option value="archival">Archival</option>
                </select>
                <select id="orientationFilter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                    <option value="all">Tất cả định dạng</option>
                    <option value="vertical">Dọc 9:16</option>
                    <option value="horizontal">Ngang 16:9</option>
                </select>
                <div class="text-slate-400 ml-auto text-xs"><span id="countDisplay">0</span> kết quả</div>
            </div>
        </div>

        <!-- Grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

    <script>
        let brollData = [];

        async function init() {
            try {
                const res = await fetch('broll_data.json');
                brollData = await res.json();
                renderCards(brollData);
            } catch (e) {
                console.error("Lỗi tải dữ liệu", e);
                document.getElementById('grid').innerHTML = '<div class="text-red-400">Lỗi tải broll_data.json</div>';
            }
        }

        function renderCards(data) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl overflow-hidden flex flex-col';
                
                const ytUrl = item.youtube_id ? `https://www.youtube.com/embed/${item.youtube_id}?rel=0` : '';
                
                card.innerHTML = `
                    <div class="aspect-video bg-black relative">
                        ${ytUrl ? `<iframe src="${ytUrl}" class="w-full h-full border-0" loading="lazy" allowfullscreen></iframe>` : '<div class="flex items-center justify-center h-full text-xs text-slate-500">No Video</div>'}
                    </div>
                    <div class="p-4 flex-1 flex flex-col">
                        <div class="flex gap-2 mb-2">
                            <span class="badge bg-purple-500/20 text-purple-300 border border-purple-500/30">${item.category || 'N/A'}</span>
                            <span class="badge bg-slate-800 text-slate-300 border border-slate-700">${item.orientation === 'vertical' ? '📱 9:16' : '🖥️ 16:9'}</span>
                        </div>
                        <h3 class="font-bold text-sm mb-2 line-clamp-2" title="${item.title}">${item.title}</h3>
                        <p class="text-xs text-slate-400 line-clamp-2 mb-3">${item.description}</p>
                        ${item.dialogue ? `<div class="mt-auto p-2 bg-purple-900/20 rounded-md border border-purple-900/30 text-[11px] italic text-purple-300 line-clamp-2">💬 ${item.dialogue}</div>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('countDisplay').innerText = data.length;
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const ori = document.getElementById('orientationFilter').value;

            const filtered = brollData.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(query) || 
                                    item.description.toLowerCase().includes(query) || 
                                    item.dialogue.toLowerCase().includes(query);
                const matchCat = cat === 'all' || item.category === cat;
                const matchOri = ori === 'all' || item.orientation === ori;
                return matchSearch && matchCat && matchOri;
            });

            renderCards(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('categoryFilter').addEventListener('change', filterData);
        document.getElementById('orientationFilter').addEventListener('change', filterData);

        init();
    </script>
</body>
</html>
